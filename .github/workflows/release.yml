name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - name: Collect release jars
        run: |
          mkdir -p dist
          shopt -s nullglob
          for f in build/libs/*.jar; do
            case "$f" in
              *-sources.jar) continue ;;
              *-javadoc.jar) continue ;;
              *-dev.jar)     continue ;;
              *-slim.jar)    continue ;;
            esac
            cp "$f" dist/
          done
          echo "Release assets:"
          ls -la dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: 豹猫指示牌模组 ${{ github.ref_name }}
          body: |
            豹猫指示牌模组（Ocelot Sign Mod）的 **Minecraft 1.18.2 / Fabric** 版本。

            本模组是「迷上城建」(Mishang Urban Construction) 的附属模组，为其提供中国道路
            风格的指示牌、立柱与路面标线方块。

            ## 环境要求

            | | |
            | --- | --- |
            | Minecraft | 1.18.2 |
            | 加载器 | Fabric Loader 0.14.25 或更新 |
            | Fabric API | 0.77.0+1.18.2 或更新 |
            | 前置 | 迷上城建 (mishanguc) 1.18.2 |
            | Java | 17 |

            ## 安装

            1. 安装 Minecraft 1.18.2 与 Fabric Loader。
            2. 把 Fabric API、迷上城建立 1.18.2 和本模组一起放进 `mods/` 文件夹。
            3. 启动游戏即可在创造模式物品栏中看到本模组的四个分页（道路指示牌 / 墙面指示牌 /
               立柱 / 箭头方块）。

            > 本模组也被证实可在 Forge 1.18.2 + Sinytra Connector 环境下运行。

            ## 从源码构建

            ```bash
            ./gradlew build
            ```

            需要 JDK 17。产物位于 `build/libs/ocelotsignmod-<版本>.jar`。
            每次 push 会自动构建，打 `v*` 标签会自动发布 Release。
          files: dist/*.jar
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
